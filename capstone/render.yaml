services:
  - type: web
    name: datasheetqa
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: NVIDIA_API_KEY
        sync: false        # you'll paste this in Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: datasheetqa-data
      mountPath: /data
      sizeGB: 1            # stores uploaded PDFs + FAISS indices
